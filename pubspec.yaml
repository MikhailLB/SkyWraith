name: skywrath
description: "Sky Wraith - Zeus Lightning puzzle game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1020"
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
